[project]
name = "fieldclaw-api"
version = "0.1.0"
description = "FieldClaw site logbook API"
readme = "README.md"
authors = [
    { name = "rdksupe", email = "rishikirti534@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentmail>=0.2.0",
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
fieldclaw-api = "fieldclaw_api:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE"]
ignore = [
  "B008",   # FastAPI Depends() / File() in defaults is idiomatic
  "E501",   # line length — leave to formatter preference
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
